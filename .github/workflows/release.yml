# Pushing a version tag (git tag v1.0.0 && git push origin v1.0.0) builds the signed APK and the Arch Linux package
# and publishes them as a GitHub Release. The signing key and the Google desktop client come from repository secrets
# (Settings → Secrets and variables → Actions); see docs/DEVELOPMENT.md, "Publishing a release".
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  android:
    name: Signed APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SCRATCHY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::The SCRATCHY_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Tests and signed build
        env:
          SCRATCHY_KEYSTORE: ${{ runner.temp }}/release.jks
          SCRATCHY_STORE_PASSWORD: ${{ secrets.SCRATCHY_STORE_PASSWORD }}
          SCRATCHY_KEY_ALIAS: ${{ secrets.SCRATCHY_KEY_ALIAS }}
          SCRATCHY_KEY_PASSWORD: ${{ secrets.SCRATCHY_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease
      - name: Name it after the version
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/scratchy-${GITHUB_REF_NAME}.apk"
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk

  arch:
    name: Arch Linux package
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Build tools and libraries
        run: |
          pacman -Syu --noconfirm --needed git nodejs pnpm rust webkit2gtk-4.1 gtk3 gtk-layer-shell \
            libayatana-appindicator wl-clipboard xdg-user-dirs
          useradd -m builder
      - uses: actions/checkout@v4
      - name: Google sign-in for sync
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -z "$GOOGLE_CLIENT_ID" ] || [ -z "$GOOGLE_CLIENT_SECRET" ]; then
            echo "::error::The GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET secrets are missing"; exit 1
          fi
          printf "GOOGLE_CLIENT_ID='%s'\nGOOGLE_CLIENT_SECRET='%s'\n" "$GOOGLE_CLIENT_ID" "$GOOGLE_CLIENT_SECRET" > desktop/.env.local
      # makepkg won't run as root, and the PKGBUILD builds offline, so the builder fetches everything first.
      - name: Package
        run: |
          chown -R builder: "$GITHUB_WORKSPACE"
          sudo -u builder -H bash -c "cd '$GITHUB_WORKSPACE/desktop' && pnpm install --frozen-lockfile && cargo fetch --locked"
          sudo -u builder -H bash -c "cd '$GITHUB_WORKSPACE/desktop/packaging/arch' && makepkg -f --noconfirm"
          rm -f desktop/.env.local
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: desktop/packaging/arch/*.pkg.tar.zst

  publish:
    name: Publish the release
    needs: [android, arch]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
