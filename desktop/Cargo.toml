[workspace]
resolver = "2"
members = ["apps/desktop/src-tauri"]

# The everyday build: the libraries (Tauri, WebKit bindings, serde, base64…) fully optimized, Scratchy's own code
# lightly, and less debug info. Same target/debug path, so the shortcut and start at login keep working.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
