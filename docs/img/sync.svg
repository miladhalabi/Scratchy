<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs><linearGradient id="l" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5fe6cf"/><stop offset="1" stop-color="#5fe6cf" stop-opacity="0.4"/></linearGradient></defs>
  <rect width="600" height="380" rx="28" fill="#0e1417"/>
  <text x="32" y="52" font-size="22" font-weight="700" fill="#f2f6f6">Private sync</text>
  <text x="32" y="78" font-size="14" fill="#8fa3a6">Encrypted before it leaves your phone.</text>
  <!-- phone -->
  <g transform="translate(46 150)"><rect width="84" height="150" rx="16" fill="#141b1f" stroke="#2c373b" stroke-width="2"/>
    <rect x="12" y="22" width="60" height="8" rx="4" fill="#2a363c"/><rect x="12" y="38" width="44" height="8" rx="4" fill="#2a363c"/><rect x="12" y="54" width="52" height="8" rx="4" fill="#2a363c"/>
    <text x="42" y="182" font-size="13" fill="#8fa3a6" text-anchor="middle">Phone</text></g>
  <!-- cloud -->
  <g transform="translate(236 120)">
    <path d="M40 120 a30 30 0 0 1 4 -59 a40 40 0 0 1 77 6 a28 28 0 0 1 -6 53 Z" fill="#141b1f" stroke="#2c373b" stroke-width="2"/>
    <rect x="62" y="82" width="38" height="30" rx="6" fill="#12302f" stroke="#5fe6cf" stroke-width="2"/>
    <path d="M69 82 v-8 a12 12 0 0 1 24 0 v8" fill="none" stroke="#7ff0dc" stroke-width="3"/>
    <text x="81" y="106" font-size="12" font-weight="700" fill="#7ff0dc" text-anchor="middle">AES</text>
    <text x="81" y="168" font-size="13" fill="#8fa3a6" text-anchor="middle">Google Drive: only scrambled data</text>
  </g>
  <!-- tablet -->
  <g transform="translate(440 160)"><rect width="114" height="130" rx="14" fill="#141b1f" stroke="#2c373b" stroke-width="2"/>
    <rect x="14" y="20" width="86" height="8" rx="4" fill="#2a363c"/><rect x="14" y="36" width="60" height="8" rx="4" fill="#2a363c"/><rect x="14" y="52" width="72" height="8" rx="4" fill="#2a363c"/>
    <text x="57" y="162" font-size="13" fill="#8fa3a6" text-anchor="middle">Tablet</text></g>
  <!-- links -->
  <path d="M138 226 H232" stroke="#5fe6cf" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/>
  <path d="M368 226 H434" stroke="#5fe6cf" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/>
  <g transform="translate(150 328)"><rect width="300" height="36" rx="18" fill="#12302f" stroke="#244a4f"/>
    <text x="150" y="23" font-size="14" font-weight="600" fill="#7ff0dc" text-anchor="middle">Edits show up in about 1 second</text></g>
</svg>
