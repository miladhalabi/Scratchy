<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1214"/><stop offset="1" stop-color="#0b0d12"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#4fe0c8" stop-opacity="0.35"/><stop offset="1" stop-color="#4fe0c8" stop-opacity="0"/></radialGradient>
    <linearGradient id="vid" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b2a6b"/><stop offset="1" stop-color="#d9647a"/></linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7ff0dc"/><stop offset="1" stop-color="#2fc4ad"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/></filter>
    <clipPath id="scr"><rect x="842" y="62" width="272" height="516" rx="30"/></clipPath>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1000" cy="330" r="360" fill="url(#glow)"/>
  <circle cx="120" cy="560" r="260" fill="url(#glow)" opacity="0.4"/>

  <g transform="translate(96 168)">
    <rect width="76" height="76" rx="22" fill="url(#acc)"/>
    <path d="M24 50 L36 24 L52 52" fill="none" stroke="#06231e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="100" y="56" font-size="64" font-weight="800" fill="#f2f6f6" letter-spacing="-2">Scratchy</text>
  </g>
  <text x="96" y="330" font-size="40" font-weight="700" fill="#f2f6f6" letter-spacing="-1">A note card that floats</text>
  <text x="96" y="378" font-size="40" font-weight="700" fill="#f2f6f6" letter-spacing="-1">over <tspan fill="#5fe6cf">any app.</tspan></text>
  <text x="96" y="436" font-size="20" fill="#8fa3a6">Tap the edge of your screen. Write the idea.</text>
  <text x="96" y="466" font-size="20" fill="#8fa3a6">Close it. You never left what you were doing.</text>
  <g transform="translate(96 512)" font-size="15" font-weight="600">
    <rect width="150" height="38" rx="19" fill="#13262a" stroke="#244a4f"/><text x="75" y="25" fill="#7ff0dc" text-anchor="middle">Floating card</text>
    <rect x="162" width="132" height="38" rx="19" fill="#13262a" stroke="#244a4f"/><text x="228" y="25" fill="#7ff0dc" text-anchor="middle">AI categories</text>
    <rect x="306" width="150" height="38" rx="19" fill="#13262a" stroke="#244a4f"/><text x="381" y="25" fill="#7ff0dc" text-anchor="middle">Secret vault</text>
    <rect x="468" width="152" height="38" rx="19" fill="#13262a" stroke="#244a4f"/><text x="544" y="25" fill="#7ff0dc" text-anchor="middle">Private sync</text>
  </g>

  <!-- phone -->
  <g filter="url(#sh)">
    <rect x="830" y="50" width="296" height="540" rx="42" fill="#0e1115" stroke="#2a3138" stroke-width="3"/>
  </g>
  <g clip-path="url(#scr)">
    <rect x="842" y="62" width="272" height="516" fill="url(#vid)"/>
    <circle cx="1090" cy="150" r="70" fill="#fff" opacity="0.08"/>
    <circle cx="880" cy="500" r="110" fill="#000" opacity="0.18"/>
    <circle cx="978" cy="214" r="34" fill="#000" opacity="0.35"/>
    <path d="M969 198 L996 214 L969 230 Z" fill="#fff"/>
    <rect x="862" y="520" width="232" height="5" rx="2.5" fill="#fff" opacity="0.35"/>
    <rect x="862" y="520" width="96" height="5" rx="2.5" fill="#fff"/>
    <!-- edge bar -->
    <rect x="1102" y="250" width="8" height="120" rx="4" fill="url(#acc)"/>
    <!-- card -->
    <g transform="translate(868 282)">
      <rect width="214" height="214" rx="22" fill="#14191d" opacity="0.94" stroke="#2c373b"/>
      <text x="18" y="36" font-size="15" font-weight="700" fill="#f2f6f6">Gift ideas for Sam</text>
      <rect x="18" y="46" width="178" height="1" fill="#2c373b"/>
      <g font-size="12.5" fill="#c3d0d2">
        <rect x="18" y="62" width="13" height="13" rx="4" fill="none" stroke="#5fe6cf" stroke-width="1.6"/><text x="40" y="73">Vinyl: Kind of Blue</text>
        <rect x="18" y="86" width="13" height="13" rx="4" fill="#5fe6cf"/><path d="M21 93 l3 3 l5 -6" stroke="#06231e" stroke-width="1.8" fill="none" stroke-linecap="round"/><text x="40" y="97" opacity="0.55" text-decoration="line-through">Candle</text>
        <rect x="18" y="110" width="13" height="13" rx="4" fill="none" stroke="#5fe6cf" stroke-width="1.6"/><text x="40" y="121">Hiking socks</text>
      </g>
      <rect x="18" y="142" width="96" height="8" rx="4" fill="#26323a"/>
      <rect x="18" y="158" width="150" height="8" rx="4" fill="#26323a"/>
      <rect x="18" y="178" width="70" height="22" rx="11" fill="#17383a"/><text x="53" y="193" font-size="11.5" font-weight="600" fill="#7ff0dc" text-anchor="middle">✦ Shopping</text>
    </g>
  </g>
  <rect x="1048" y="76" width="2" height="2" fill="none"/>
</svg>
