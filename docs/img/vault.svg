<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs><radialGradient id="g" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#5fe6cf" stop-opacity="0.45"/><stop offset="1" stop-color="#5fe6cf" stop-opacity="0"/></radialGradient></defs>
  <rect width="600" height="380" rx="28" fill="#0e1417"/>
  <text x="32" y="52" font-size="22" font-weight="700" fill="#f2f6f6">Secret vault</text>
  <text x="32" y="78" font-size="14" fill="#8fa3a6">Pull down. Keep going. Let go.</text>
  <!-- steps -->
  <g transform="translate(40 110)">
    <rect width="150" height="236" rx="20" fill="#141b1f"/>
    <rect x="14" y="20" width="58" height="60" rx="12" fill="#1f2a30"/><rect x="78" y="20" width="58" height="60" rx="12" fill="#1f2a30"/>
    <rect x="14" y="88" width="58" height="60" rx="12" fill="#1f2a30"/><rect x="78" y="88" width="58" height="60" rx="12" fill="#1f2a30"/>
    <text x="75" y="220" font-size="13" fill="#8fa3a6" text-anchor="middle">1  Normal pull: nothing</text>
  </g>
  <g transform="translate(225 110)">
    <rect width="150" height="236" rx="20" fill="#141b1f"/>
    <g transform="translate(0 44)">
      <rect x="14" y="20" width="58" height="60" rx="12" fill="#1f2a30"/><rect x="78" y="20" width="58" height="60" rx="12" fill="#1f2a30"/>
      <rect x="14" y="88" width="58" height="60" rx="12" fill="#1f2a30"/><rect x="78" y="88" width="58" height="60" rx="12" fill="#1f2a30"/>
    </g>
    <path d="M75 20 v28 m-8 -8 l8 8 l8 -8" stroke="#8fa3a6" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="75" y="220" font-size="13" fill="#8fa3a6" text-anchor="middle">2  Keep pulling</text>
  </g>
  <g transform="translate(410 110)">
    <rect width="150" height="236" rx="20" fill="#141b1f"/>
    <circle cx="75" cy="40" r="40" fill="url(#g)"/>
    <circle cx="75" cy="40" r="22" fill="#12302f" stroke="#5fe6cf" stroke-width="2"/>
    <rect x="66" y="39" width="18" height="14" rx="3" fill="#7ff0dc"/><path d="M69 39 v-5 a6 6 0 0 1 12 0 v5" fill="none" stroke="#7ff0dc" stroke-width="2.4"/>
    <g transform="translate(0 70)">
      <rect x="14" y="20" width="58" height="60" rx="12" fill="#1f2a30"/><rect x="78" y="20" width="58" height="60" rx="12" fill="#1f2a30"/>
      <rect x="14" y="88" width="58" height="40" rx="12" fill="#1f2a30"/>
    </g>
    <text x="75" y="220" font-size="13" fill="#7ff0dc" text-anchor="middle">3  Lock shows. Release.</text>
  </g>
  <text x="300" y="372" font-size="13" fill="#6f8286" text-anchor="middle">Password and fingerprint. Encrypted on the phone.</text>
